#version: "3.0"

services:
  cwl_processor:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NEO4J_URI=neo4j://neo4j-server:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=your_new_password
      - NEO4JLABS_PLUGINS=["apoc"]
  neo4j-server:
    image: neo4j:ubi9
    ports:
      - "7474:7474"
      - "7687:7687"    
    environment:
      - NEO4J_AUTH=neo4j/your_new_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7687"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: ["neo4j"]  # Starts Neo4j

